    name: House Harrow
    color: "#5b2a86"          # quoted, or YAML reads a comment
    motto: 'Root and branch'  # unknown key in a house
  - id: quill
    name: 'House Quill'
    color: '#2a6f86'

people:
  # First generation
  - id: "0017"                # a quoted id; it stays text
    name: "Maud Quill"
    house: quill
    sex: f
    born: "1104-03-09"        # a quoted date

  # Second generation
  - id: edric
    name: Edric Harrow
    house: harrow
    sex: m
    born: 1131
    parents: ["0017"]
  - id: rosamund
    name: 'Rosamund Harrow'
    nickname: Ros
    sex: f
    born: 1133
    parents:
      - "0017"
  - id: piers
    name: Piers Harrow
    sex: m
    born: 1136
  # Wards and married-in
  - id: tamsin
    name: Tamsin
    title: Keeper of the Rolls
    sex: f
  - {id: joan, name: Joan Marsh, sex: f, born: 1135}   # a flow-map person

unions:
